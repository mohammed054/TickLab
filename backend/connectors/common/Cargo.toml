[package]
name = "ticklab-connectors-common"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# NATS is the backend-internal bus for market-data fan-out
# (docs/03 §3.1, docs/06 §6.3). async-nats is the Tokio-native client.
async-nats = "0.36"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
