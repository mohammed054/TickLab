[package]
name = "ticklab-connector-binance-futures"
version = "0.1.0"
edition = "2021"

[dependencies]
ticklab-connectors-common = { path = "../common" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
async-nats = "0.36"
