[package]
name = "ticklab-jobs"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tower = "0.4"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
# Engine abstraction layer gRPC client
ticklab-engine-abstraction = { path = "../../engine/abstraction" }
# Job queue / NATS integration
nats = { version = "0.25", features = ["std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1.0"