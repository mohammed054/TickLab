apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ticklab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/ticklab/gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: postgres://postgres@postgres:5432/ticklab
            - name: REDIS_URL
              value: redis://redis:6379
            - name: NATS_URL
              value: nats://nats:4222
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ticklab
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080