apiVersion: apps/v1
kind: Deployment
metadata:
  name: data
  namespace: ticklab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data
  template:
    metadata:
      labels:
        app: data
    spec:
      containers:
        - name: data
          image: ghcr.io/ticklab/data:latest
          env:
            - name: DATABASE_URL
              value: postgres://postgres@postgres:5432/ticklab
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"