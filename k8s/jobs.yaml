apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs
  namespace: ticklab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobs
  template:
    metadata:
      labels:
        app: jobs
    spec:
      containers:
        - name: jobs
          image: ghcr.io/ticklab/jobs:latest
          env:
            - name: DATABASE_URL
              value: postgres://postgres@postgres:5432/ticklab
            - name: REDIS_URL
              value: redis://redis:6379
            - name: NATS_URL
              value: nats://nats:4222
            - name: ENGINE_GRPC_ADDR
              value: engine:50051
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: jobs
  namespace: ticklab
spec:
  selector:
    app: jobs
  ports:
    - port: 50052
      targetPort: 50052