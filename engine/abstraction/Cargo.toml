[package]
name = "ticklab-engine-abstraction"
version = "0.1.0"
edition = "2021"

[dependencies]
# Vendored hftbacktest crate — the core engine types and simulation logic
# (docs/04). Points at the `hftbacktest` package inside the upstream workspace
# (engine/vendor/hftbacktest is a virtual manifest; the crate lives in its
# `hftbacktest/` subdirectory). Block 2.3 fix: the original
# `path = "../vendor/hftbacktest"` never resolved and the crate could not
# compile. Only the `backtest` feature is enabled — the `live` connector/IPC
# stack is not needed by the abstraction layer (Phase 5 concern, docs/06).
hftbacktest = { path = "../vendor/hftbacktest/hftbacktest", default-features = false, features = ["backtest"] }

# Error handling
thiserror = { version = "1.0" }

# gRPC runtime for the EngineService (docs/03 §3.4, docs/15 §15.4).
# prost is tonic-build's codegen runtime; tokio (+ macros for tests) drives the
# server; tokio-stream provides the server-streaming response types.
tonic = { version = "0.11" }
prost = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[build-dependencies]
tonic-build = { version = "0.11" }