[package]
name = "ticklab-engine-abstraction"
version = "0.1.0"
edition = "2021"

[dependencies]
# Vendored hftbacktest crate — the core engine types and simulation logic
# (docs/04). Initialized in Block 1.1; see STATE.md [2.2.B] for status.
hftbacktest = { path = "../vendor/hftbacktest" }

# Error handling
thiserror = { version = "1.0" }

# gRPC runtime for the EngineService (docs/03 §3.4, docs/15 §15.4).
# prost is tonic-build's codegen runtime; tokio (+ macros for tests) drives the
# server; tokio-stream provides the server-streaming response types.
tonic = { version = "0.11" }
prost = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[build-dependencies]
tonic-build = { version = "0.11" }