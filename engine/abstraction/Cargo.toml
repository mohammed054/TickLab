[package]
name = "ticklab-engine-abstraction"
version = "0.1.0"
edition = "2021"

[dependencies]
# Vendored hftbacktest crate — the core engine types and simulation logic
# (docs/04). Block 2.5 fix: path must address the `hftbacktest` package
# (engine/vendor/hftbacktest/hftbacktest), not the workspace root
# (engine/vendor/hftbacktest), which is a virtual manifest and makes every
# `cargo` invocation fail dependency resolution. Features are pinned to
# `backtest` only: the abstraction layer drives backtests (Phase 2); the live
# bot runtime (`live` feature: iceoryx2/tokio-full/...) is Phase 5 scope
# (docs/04 §4.5) and is not fetched here.
hftbacktest = { path = "../vendor/hftbacktest/hftbacktest", default-features = false, features = ["backtest"] }

# Error handling
thiserror = { version = "1.0" }

# gRPC runtime for the EngineService (docs/03 §3.4, docs/15 §15.4).
# prost is tonic-build's codegen runtime; tokio (+ macros for tests) drives the
# server; tokio-stream provides the server-streaming response types.
tonic = { version = "0.11" }
prost = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[build-dependencies]
tonic-build = { version = "0.11" }